<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#211e22" />
    <meta name="description" content="Уютная lo-fi-комната для кодинга и спокойных вечеров." />
    <title>LofLume — Home Work</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="preload" as="font" type="font/ttf" href="/fonts/manrope-variable.ttf" crossorigin />
    <link rel="preload" as="image" href="/assets/cozy-coding-v3.webp" />
  </head>
  <body>
    <main class="room" aria-label="Домашняя комната для кодинга">
      <div class="scene-viewport">
        <div class="scene" id="scene">
          <img class="scene-image" id="scene-image" src="/assets/cozy-coding-v3.webp" alt="Девушка в наушниках работает за ноутбуком у окна. За окном закат над городом и рекой. На столе — чашка, часы, радио и лампа." fetchpriority="high" width="1672" height="941" />
          <svg class="atmosphere" viewBox="0 0 1672 941" aria-hidden="true" focusable="false">
            <defs>
              <filter id="steam-softness" x="-100%" y="-40%" width="300%" height="180%"><feGaussianBlur stdDeviation="2"/></filter>
            </defs>
            <g class="steam" filter="url(#steam-softness)">
              <path class="steam-wisp steam-wisp-one" d="M710 677 C697 656 727 643 713 622 C703 606 713 595 718 588"/>
              <path class="steam-wisp steam-wisp-two" d="M731 678 C744 658 719 645 735 624 C746 607 732 597 735 582"/>
              <path class="steam-wisp steam-wisp-three" d="M720 675 C735 654 710 639 722 623 C735 607 726 592 730 578"/>
            </g>
          </svg>
          <svg class="room-objects" id="room-objects" viewBox="0 0 1672 941" aria-label="Предметы в комнате">
            <defs>
              <marker id="pencil-arrow" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="10" markerHeight="10" orient="auto-start-reverse"><path d="M2 2 Q6 5 10 6 Q6 7 2 10"/></marker>
            </defs>
            <g class="object-target" data-object="timer" tabindex="0" role="img" aria-label="Часы">
              <path class="object-shape" d="M1281 679 Q1271 677 1269 690 L1261 748 Q1258 761 1271 765 L1393 780 Q1408 783 1412 769 L1420 707 Q1420 694 1407 691 Z"/>
            </g>
            <g class="object-target" data-object="music" tabindex="0" role="button" aria-label="Радио — включить музыку" aria-haspopup="dialog" aria-expanded="false" aria-controls="music-panel">
              <path class="object-shape" d="M1456 645 L1524 640 L1526 635 Q1527 627 1539 628 L1644 633 Q1654 633 1655 642 L1671 647 L1671 779 Q1668 788 1657 785 L1454 762 Q1443 761 1444 748 L1446 659 Q1447 649 1456 645 Z"/>
            </g>
            <g class="object-target" data-object="light" tabindex="0" role="img" aria-label="Лампа">
              <path class="object-shape" d="M1487 304 C1447 305 1413 333 1393 371 Q1385 382 1403 391 C1440 413 1501 432 1540 433 Q1556 435 1557 421 C1567 372 1546 323 1518 311 Q1504 306 1487 304 Z"/>
            </g>
            <g class="annotations" id="landmarks" hidden aria-hidden="true">
              <g class="annotation"><text x="1170" y="855" transform="rotate(-7 1170 855)">часы</text><path class="annotation-arrow" d="M1233 826 Q1265 816 1285 784"/></g>
              <g class="annotation"><text x="1478" y="862" transform="rotate(5 1478 862)">радио</text><path class="annotation-arrow" d="M1533 829 Q1555 813 1544 783"/></g>
              <g class="annotation"><text x="1195" y="250" transform="rotate(-6 1195 250)">лампа</text><path class="annotation-arrow" d="M1283 256 Q1350 235 1432 329"/></g>
            </g>
          </svg>
          <section class="music-panel" id="music-panel" role="dialog" aria-modal="false" aria-labelledby="music-heading" hidden>
            <header class="music-panel-heading"><span id="music-heading">Радио LofLume</span><button class="music-close" id="music-close" type="button" aria-label="Закрыть радио"><svg viewBox="0 0 20 20" aria-hidden="true"><path d="m5 5 10 10M15 5 5 15"/></svg></button></header>
            <p id="music-title" class="music-title" aria-live="polite"></p>
            <p id="music-artist" class="music-artist"></p>
            <p id="music-message" class="music-message" role="status"></p>
            <div class="music-actions"><button id="music-play" class="music-play" type="button">Включить</button></div>
            <div class="music-volume"><label for="music-volume">Громкость</label><output id="music-volume-value" for="music-volume">45%</output><input id="music-volume" aria-label="Громкость музыки" type="range" min="0" max="100" value="45" /></div>
          </section>
          <audio id="scene-audio" preload="none"></audio>
        </div>
      </div>
      <header class="room-header">
        <span class="wordmark" aria-label="LofLume"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 19V8a7 7 0 0 1 14 0v11H5ZM12 2v17M5 11h14"/></svg>loflume</span>
        <button class="icon-button" id="fullscreen" type="button" aria-label="На весь экран" title="На весь экран"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5H5v3m11-3h3v3M5 16v3h3m11-3v3h-3"/></svg></button>
      </header>
      <footer class="room-footer">
        <div class="room-caption" id="room-caption"><h1>Home Work</h1><p class="eyebrow">Lofi · chill · focus</p></div>
        <div class="now-playing" id="now-playing" hidden aria-label="Сейчас играет">
          <button class="radio-toggle" id="radio-toggle" type="button" aria-label="Пауза"><svg viewBox="0 0 20 20" aria-hidden="true"><path id="radio-toggle-icon" d="M7 5v10M13 5v10"/></svg></button>
          <div class="ticker-viewport"><div class="ticker-track">
            <span class="ticker-copy"><span class="ticker-title"></span><span aria-hidden="true"> — </span><a class="ticker-artist" target="_blank" rel="noopener noreferrer"></a></span>
            <span class="ticker-copy" aria-hidden="true"><span class="ticker-title"></span><span> — </span><a class="ticker-artist" tabindex="-1" target="_blank" rel="noopener noreferrer"></a></span>
          </div></div>
          <span class="radio-status" id="radio-status" hidden></span>
        </div>
        <button class="explore-button" id="explore" type="button" aria-pressed="false" aria-controls="landmarks"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="6" cy="12" r="1.5"/><circle cx="12" cy="12" r="1.5"/><circle cx="18" cy="12" r="1.5"/></svg><span>Осмотреться</span></button>
      </footer>
      <p id="status" class="sr-only" role="status" aria-live="polite"></p>
      <div id="image-error" class="image-error" hidden><p>Не удалось открыть комнату.</p><button type="button" id="retry-image">Попробовать ещё раз</button></div>
    </main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
